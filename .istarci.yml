# IstarCI configuration, read from the root of the repository.

runner:
  image: ghcr.io/devpro/ubuntu-dotnet:latest
  images:
    "git-check*": ghcr.io/devpro/debian-node:latest
    "markup-lint*": ghcr.io/devpro/debian-node:latest
    "image-scan*": ghcr.io/devpro/debian-node:latest
  # The scan jobs build an image and scan it through the host Docker daemon.
  docker: ["image-scan*"]
  # The analysis runs against the SonarQube IstarCI starts on this machine, with a token made there.
  sonarqube: true

workflow:
  onDisallowedAction: fail
  # GitHub's own actions, and the composite replacements for every other one kept in github-workflow-parts.
  allowedActions:
    - actions/*
    - github/*
    - devpro/github-workflow-parts/*
  # Delivery and deployment publish or hold credentials, which a local run must never reach.
  exclude:
    - pkg.yaml
    - pages.yaml
    - demo.yaml

# Repository variables the pipeline reads: a local run otherwise gets them as placeholders, whose uppercase an image tag refuses.
vars:
  # FOSSA analyses on its own service with an API key, which a local run never holds.
  FOSSA_ENABLED: "false"
  # The local SonarQube has no organizations, and a non-empty one is what turns the analysis on.
  SONAR_ORG: local
  SONAR_PROJECT_KEY: terraform-backend-mongodb
  CONTAINER_REGISTRY_PATH: devprofr
  CONTAINER_IMAGE_NAME: terraform-backend-mongodb
