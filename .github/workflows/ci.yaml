name: CI
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# purpose: Continuous Integration pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run-code-quality:
        description: 'Check code quality?'
        required: false
        type: boolean
        default: false
      run-image-scan:
        description: 'Scan container image?'
        required: false
        type: boolean
        default: false

concurrency:
  group: "${{ github.ref }}-ci"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  git-check:
    name: Git
    uses: ./.github/workflows/reusable-git-check.yml
    with:
      is-pull-request: ${{ github.event_name == 'pull_request' }}

  markup-lint:
    name: Markup
    uses: devpro/github-workflow-parts/.github/workflows/reusable-markup-lint.yml@35750e9d1a21724d3a7e028ee9bc6da02dcb5afb

  code-quality:
    name: Code
    needs: git-check
    if: needs.git-check.outputs.app_changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.run-code-quality)
    uses: devpro/github-workflow-parts/.github/workflows/reusable-dotnet-quality.yml@35750e9d1a21724d3a7e028ee9bc6da02dcb5afb
    with:
      custom-commands: |
        # The runner image has no sudo, so Terraform and MongoDB come from their archives into the temporary directory instead of apt packages.
        echo "Install Terraform"
        mkdir -p "${RUNNER_TEMP}/bin"
        curl -fsSL -o "${RUNNER_TEMP}/terraform.zip" https://releases.hashicorp.com/terraform/1.16.5/terraform_1.16.5_linux_amd64.zip
        pwsh -NoProfile -Command "Expand-Archive -Force -Path '${RUNNER_TEMP}/terraform.zip' -DestinationPath '${RUNNER_TEMP}/bin'"
        chmod +x "${RUNNER_TEMP}/bin/terraform"
        echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
        echo "Install and start MongoDB 8.2"
        mkdir -p "${RUNNER_TEMP}/mongodb/bin" "${RUNNER_TEMP}/mongodb/data"
        curl -fsSL https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2404-8.2.1.tgz |
          tar xz --strip-components=2 -C "${RUNNER_TEMP}/mongodb/bin" --wildcards "*/bin/mongod"
        "${RUNNER_TEMP}/mongodb/bin/mongod" --dbpath "${RUNNER_TEMP}/mongodb/data" --bind_ip 127.0.0.1 \
          --fork --logpath "${RUNNER_TEMP}/mongodb/mongod.log"
        timeout 30 bash -c "
          until (echo > /dev/tcp/127.0.0.1/27017) 2>/dev/null; do
            echo 'MongoDB not ready yet, retrying in 1 second...'
            sleep 1
          done
        "
      dotnet-test-args: "--report-xunit-trx --coverage --coverage-output-format cobertura"
      extra-vars: |
        Features__IsHttpsRedirectionEnabled=false
      fossa-enabled: ${{ vars.FOSSA_ENABLED != 'false' }}
      sonar-enabled: true
      sonar-host-url: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
      sonar-organization: ${{ vars.SONAR_ORG }}
      sonar-project-key: ${{ vars.SONAR_PROJECT_KEY }}
      sonar-project-name: Terraform Backend MongoDB
      workflow-parts-version: 35750e9d1a21724d3a7e028ee9bc6da02dcb5afb
    secrets:
      fossa-api-key: ${{ secrets.FOSSA_API_KEY }}
      sonar-token: ${{ secrets.SONAR_TOKEN }}
    permissions:
      contents: read
      pull-requests: write

  image-scan:
    name: Image
    needs: git-check
    if: needs.git-check.outputs.app_changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.run-image-scan)
    uses: devpro/github-workflow-parts/.github/workflows/reusable-container-scan.yml@35750e9d1a21724d3a7e028ee9bc6da02dcb5afb
    with:
      image-definition: "src/WebApi/Dockerfile"
      image-name: ${{ vars.CONTAINER_IMAGE_NAME }}
      image-path: ${{ vars.CONTAINER_REGISTRY_PATH }}
      image-tag: "${{ needs.git-check.outputs.version_major_minor }}.${{ github.run_id }}"
      max-high-cves: 0
      max-medium-cves: 0
      workflow-parts-version: 35750e9d1a21724d3a7e028ee9bc6da02dcb5afb
